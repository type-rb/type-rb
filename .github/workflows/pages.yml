name: Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Classify test scope
        id: test-scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ] || ! git rev-parse HEAD^ >/dev/null 2>&1; then
            full_tests=true
          else
            full_tests="$(git diff --name-only HEAD^ HEAD | ./scripts/pages-full-tests-required.sh)"
          fi
          echo "full-tests=$full_tests" >> "$GITHUB_OUTPUT"
          echo "Full compiler tests required: $full_tests"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ruby/setup-ruby@v1
        if: steps.test-scope.outputs.full-tests == 'true'

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            tools/textmate/package-lock.json
            tools/site/package-lock.json

      - name: Install TypeScript compiler
        if: steps.test-scope.outputs.full-tests == 'true'
        run: npm install --global typescript@7.0.2

      - name: Verify compiler and tour
        if: steps.test-scope.outputs.full-tests == 'true'
        run: go test ./...

      - name: Verify workflow tooling
        run: |
          ./scripts/extract-release-notes_test.sh
          ./scripts/pages-full-tests-required_test.sh
          ./scripts/render-homebrew-formula_test.sh

      - name: Verify website Go packages
        run: go test ./internal/site ./internal/playground ./cmd/trb-site

      - name: Verify TextMate grammar
        run: |
          npm ci --prefix tools/textmate
          npm test --prefix tools/textmate

      - name: Verify website build tools
        run: |
          npm ci --prefix tools/site
          npm test --prefix tools/site

      - name: Build TypeRB website
        shell: bash
        run: |
          set -euo pipefail
          version="$(go run ./cmd/trb version)"
          ./scripts/build-site.sh dist/site "$version"
          test -s dist/site/index.html
          test -s dist/site/docs/index.html
          test -s dist/site/docs/getting-started/index.html
          test -s dist/site/docs/guides/linting/index.html
          test -s dist/site/docs/lint-rules/index.html
          test -s dist/site/docs/lint-rules/prefer-conditional-transfer/index.html
          test -s dist/site/play/index.html
          test -s dist/site/tour/index.html
          test -s dist/site/llms.txt
          test -s dist/site/assets/trb.wasm
          test -s dist/site/assets/wasm_exec.js
          grep -F 'href="/docs/"' dist/site/index.html
          grep -F 'href="/tour/"' dist/site/index.html
          grep -F 'href="/play/"' dist/site/index.html
          grep -F 'class="shiki github-dark-default"' dist/site/docs/getting-started/index.html
          if grep -R -F 'class="language-trb"' dist/site/docs; then
            echo "TypeRB documentation fences were not statically highlighted" >&2
            exit 1
          fi
          grep -F 'url=/' dist/site/type-rb/index.html
          grep -F 'url=/tour/' dist/site/type-rb/tour/index.html
          grep -F 'url=/play/' dist/site/type-rb/play/index.html
          grep -F '"transport": "wasm"' dist/site/runtime.json
          grep -F '"version": "'"$version"'"' dist/site/runtime.json
          grep -F '# TypeRB' dist/site/llms.txt
          grep -F 'https://type-rb.github.io/docs/specification/' dist/site/llms.txt

      - name: Prepare legacy Pages redirects
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/legacy-pages/play dist/legacy-pages/tour
          cp dist/site/type-rb/index.html dist/legacy-pages/index.html
          cp dist/site/type-rb/play/index.html dist/legacy-pages/play/index.html
          cp dist/site/type-rb/tour/index.html dist/legacy-pages/tour/index.html

      - name: Publish organization Pages branch
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PAGES_DEPLOY_KEY" ]; then
            echo "PAGES_DEPLOY_KEY must be configured to publish type-rb/type-rb.github.io" >&2
            exit 1
          fi

          key_file="$RUNNER_TEMP/type-rb-pages-deploy-key"
          known_hosts_file="$RUNNER_TEMP/type-rb-pages-known-hosts"
          site_dir="$RUNNER_TEMP/type-rb-github-io"
          site_repository="git@github.com:type-rb/type-rb.github.io.git"

          umask 077
          printf '%s\n' "$PAGES_DEPLOY_KEY" > "$key_file"
          ssh-keyscan github.com > "$known_hosts_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts_file"

          if git ls-remote --exit-code --heads "$site_repository" refs/heads/site >/dev/null; then
            git clone --depth 1 --branch site "$site_repository" "$site_dir"
          else
            mkdir -p "$site_dir"
            git -C "$site_dir" init --initial-branch=site
            git -C "$site_dir" remote add origin "$site_repository"
          fi

          rsync --archive --delete --exclude .git/ dist/site/ "$site_dir/"
          touch "$site_dir/.nojekyll"
          git -C "$site_dir" config user.name "github-actions[bot]"
          git -C "$site_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$site_dir" add --all
          if git -C "$site_dir" diff --cached --quiet; then
            echo "Pages content is already current."
            exit 0
          fi
          git -C "$site_dir" commit -m "Deploy TypeRB website from $GITHUB_SHA"
          git -C "$site_dir" push origin HEAD:site

      - name: Configure legacy GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload legacy Pages redirects
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/legacy-pages

  deploy-legacy-redirects:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy legacy Pages redirects
        id: deployment
        uses: actions/deploy-pages@v5
