name: Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
      - "LICENSE"
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check out the exact site generator source
        uses: actions/checkout@v6
        with:
          repository: type-rb/type-rb-go
          ref: 7638f15416544c562bc22d01ec640bff755b815d
          path: .site-generator
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: .go-version
          cache-dependency-path: .site-generator/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: .site-generator/tools/site/package-lock.json

      - name: Verify site and published contract tooling
        run: |
          (cd .site-generator && go test ./internal/site ./internal/releasecontract ./tools/release-contract)
          (cd .site-generator && go run ./tools/release-contract --check)
          cmp contracts/v0.5/manifest.json .site-generator/contracts/v0.5/manifest.json
          cmp contracts/v0.5/surfaces.json .site-generator/contracts/v0.5/surfaces.json
          cmp docs/v0.5-feature-contract.md .site-generator/docs/v0.5-feature-contract.md
          npm ci --prefix .site-generator/tools/site
          npm test --prefix .site-generator/tools/site

      - name: Verify the published release before deployment
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "v$(cat NATIVE_VERSION)" --json isDraft --jq '.isDraft' | grep -x false

      - name: Build the canonical documentation site
        shell: bash
        run: |
          set -euo pipefail
          (cd .site-generator && go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/trb-site" ./cmd/trb-site)
          "$RUNNER_TEMP/trb-site" --out dist/site --docs docs --version "$(cat NATIVE_VERSION)" --docs-only
          node .site-generator/tools/site/highlight.mjs dist/site syntaxes/typerb.tmLanguage.json
          cp llms.txt dist/site/llms.txt
          cp docs/capabilities/styles.css dist/site/styles.css
          cp -R docs/capabilities/dependencies dist/site/dependencies
          test -s dist/site/docs/getting-started/index.html
          test -s dist/site/docs/native-cli/index.html
          test -s dist/site/dependencies/index.html
          grep -F 'temporarily paused' dist/site/play/index.html
          grep -F 'temporarily paused' dist/site/tour/index.html
          test ! -e dist/site/assets/trb.wasm
          test ! -e dist/site/assets/wasm_exec.js
          test ! -e dist/site/assets/playground-worker.js
          test ! -e dist/site/runtime.json
          {
            git -C .site-generator rev-parse HEAD
            go version
            sha256sum .site-generator/go.mod .site-generator/go.sum "$RUNNER_TEMP/trb-site"
          } > dist/site/site-build.txt

      - name: Include the latest application workload measurement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report=dist/site/benchmarks/application
          mkdir -p "$report"
          cp docs/capabilities/styles.css dist/site/benchmarks/styles.css
          cp docs/capabilities/benchmarks/{daily.css,representative.css,representative.js,representative-model.mjs,representative-suite.json} "$report/"
          cp docs/capabilities/benchmarks/representative.html "$report/index.html"
          python3 tools/representative-performance/publication.py restore --state "$RUNNER_TEMP/representative-state.json"

          # A cancelled run may have finished before uploading a state artifact.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/representative-performance.yml/runs?branch=main&event=workflow_dispatch&status=completed&per_page=1" \
            --jq '.workflow_runs[] | [.id, .head_sha, .conclusion] | @tsv')
          IFS=$'\t' read -r TRIGGER_RUN_ID TRIGGER_HEAD_SHA TRIGGER_CONCLUSION <<< "$latest"
          export TRIGGER_RUN_ID TRIGGER_HEAD_SHA TRIGGER_CONCLUSION
          python3 tools/representative-performance/publication.py site --state "$RUNNER_TEMP/representative-state.json" --output "$report/representative-state.json"

      - name: Prepare legacy Pages redirects
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/legacy-pages/play dist/legacy-pages/tour
          cp dist/site/type-rb/index.html dist/legacy-pages/index.html
          cp dist/site/type-rb/play/index.html dist/legacy-pages/play/index.html
          cp dist/site/type-rb/tour/index.html dist/legacy-pages/tour/index.html

      - name: Publish the organization Pages branch
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$PAGES_DEPLOY_KEY" ]; then
            echo "PAGES_DEPLOY_KEY must be configured to publish the organization site" >&2
            exit 1
          fi

          key_file="$RUNNER_TEMP/type-rb-pages-deploy-key"
          known_hosts_file="$RUNNER_TEMP/type-rb-pages-known-hosts"
          site_dir="$RUNNER_TEMP/type-rb-github-io"
          site_owner="$GITHUB_REPOSITORY_OWNER"
          site_repository="git@github.com:$site_owner/$site_owner.github.io.git"

          umask 077
          printf '%s\n' "$PAGES_DEPLOY_KEY" > "$key_file"
          ssh-keyscan github.com > "$known_hosts_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o UserKnownHostsFile=$known_hosts_file"

          if git ls-remote --exit-code --heads "$site_repository" refs/heads/site >/dev/null; then
            git clone --depth 1 --branch site "$site_repository" "$site_dir"
          else
            mkdir -p "$site_dir"
            git -C "$site_dir" init --initial-branch=site
            git -C "$site_dir" remote add origin "$site_repository"
          fi

          rsync --archive --delete --exclude .git/ dist/site/ "$site_dir/"
          touch "$site_dir/.nojekyll"
          git -C "$site_dir" config user.name "github-actions[bot]"
          git -C "$site_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$site_dir" add --all
          if git -C "$site_dir" diff --cached --quiet; then
            echo "Pages content is already current."
            exit 0
          fi
          git -C "$site_dir" commit -m "Deploy TypeRB website from $GITHUB_SHA"
          git -C "$site_dir" push origin HEAD:site

      - name: Configure legacy GitHub Pages
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload legacy Pages redirects
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/legacy-pages

  deploy-legacy-redirects:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy legacy Pages redirects
        id: deployment
        uses: actions/deploy-pages@v5
