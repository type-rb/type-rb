name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby

      - name: Verify compiler and bootstrap boundary
        run: |
          go test ./...
          ./scripts/check-self-host.sh

      - name: Package release binaries and Formula
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ./scripts/package-release.sh "$version" dist
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Require Homebrew tap credentials
        shell: bash
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN must be configured to update type-rb/homebrew-tap" >&2
            exit 1
          fi

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: type-rb/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: dist/homebrew-tap

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/trb_*.tar.gz \
              dist/checksums.txt \
              dist/trb.rb \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/trb_*.tar.gz \
              dist/checksums.txt \
              dist/trb.rb \
              --verify-tag \
              --generate-notes
          fi

      - name: Publish Formula to Homebrew tap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/homebrew-tap/Formula
          cp dist/trb.rb dist/homebrew-tap/Formula/trb.rb
          cd dist/homebrew-tap
          if [ -z "$(git status --porcelain -- Formula/trb.rb)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/trb.rb
          git commit -m "trb ${{ steps.package.outputs.version }}"
          git push
