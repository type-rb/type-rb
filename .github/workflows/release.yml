name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: write
  artifact-metadata: write
  attestations: write
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      RELEASE_SOURCE_TOKEN: ${{ secrets.RELEASE_SOURCE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: ruby/setup-ruby@v1

      - name: Verify compiler
        run: go test ./...

      - name: Verify release tooling
        run: ./scripts/render-homebrew-formula_test.sh

      - name: Package release binaries, Formula, and notes
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          source_version="$(sed -n 's/^var Version = "\([^"]*\)"$/\1/p' internal/cli/cli.go)"
          if [ "$source_version" != "${version}-dev" ]; then
            echo "expected source version ${version}-dev, found ${source_version}" >&2
            exit 1
          fi
          ./scripts/extract-release-notes.sh "$version" CHANGELOG.md dist/release-notes.md
          ./scripts/package-release.sh "$version" dist
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Prepare container root files
        run: |
          ./scripts/prepare-container-rootfs.sh \
            "${{ steps.package.outputs.version }}" dist dist/container

      - name: Smoke-test the release container
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.package.outputs.version }}"
          image="type-rb/trb-smoke:${version}"
          docker build \
            --file packaging/container/Dockerfile \
            --platform linux/amd64 \
            --build-arg "TYPERB_VERSION=${version}" \
            --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
            --tag "$image" .
          test "$(docker run --rm "$image")" = "$version"

      - name: Require release credentials
        shell: bash
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN must be configured to update type-rb/homebrew-tap" >&2
            exit 1
          fi
          if [ -z "$RELEASE_SOURCE_TOKEN" ]; then
            echo "RELEASE_SOURCE_TOKEN must be configured to advance the development version" >&2
            exit 1
          fi

      - name: Check out Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: type-rb/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: dist/homebrew-tap

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/trb_*.tar.gz \
              dist/checksums.txt \
              dist/trb.rb \
              --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file dist/release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/trb_*.tar.gz \
              dist/checksums.txt \
              dist/trb.rb \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file dist/release-notes.md
          fi

      - name: Publish Formula to Homebrew tap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/homebrew-tap/Formula
          cp dist/trb.rb dist/homebrew-tap/Formula/trb.rb
          cd dist/homebrew-tap
          if [ -z "$(git status --porcelain -- Formula/trb.rb)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/trb.rb
          git commit -m "trb ${{ steps.package.outputs.version }}"
          git push

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare container metadata
        id: container-metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/type-rb/trb
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Publish compiler container
        id: container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packaging/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.container-metadata.outputs.tags }}
          labels: ${{ steps.container-metadata.outputs.labels }}
          build-args: |
            TYPERB_VERSION=${{ steps.package.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          provenance: false
          sbom: true

      - name: Attest compiler container provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/type-rb/trb
          subject-digest: ${{ steps.container.outputs.digest }}
          push-to-registry: true

      - name: Advance development version through a pull request
        id: advance
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SOURCE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          release_version="${{ steps.package.outputs.version }}"
          if [[ ! "$release_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "release version is not a semantic version: $release_version" >&2
            exit 1
          fi
          next_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((10#${BASH_REMATCH[3]} + 1))"
          version_file="internal/cli/cli.go"

          git fetch origin main
          git checkout --detach origin/main

          current_version="$(sed -n 's/^var Version = "\([^"]*\)"$/\1/p' "$version_file")"
          if [ "$current_version" = "${next_version}-dev" ]; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$current_version" != "${release_version}-dev" ]; then
            echo "expected ${release_version}-dev, found $current_version" >&2
            exit 1
          fi

          escaped_release_version="${release_version//./\\.}"
          sed -i "s/^var Version = \"${escaped_release_version}-dev\"$/var Version = \"${next_version}-dev\"/" "$version_file"
          grep -Fx "var Version = \"${next_version}-dev\"" "$version_file"
          test "$(git diff --name-only)" = "$version_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="chore/advance-to-${next_version//./-}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git checkout -b "$branch"
          git add "$version_file"
          git commit -m "Advance development version to ${next_version}-dev"
          git push origin "HEAD:refs/heads/$branch"

          pr_body="$(printf '%s\n' \
            "Created automatically after the ${release_version} release." \
            "" \
            "## Release note" \
            "" \
            "Area: Tooling" \
            "Kind: None" \
            "Breaking: No" \
            "" \
            "Release bookkeeping only; this advances the source development version after publishing v${release_version}.")"
          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "Advance development version to ${next_version}-dev" \
            --assignee "@me" \
            --label chore \
            --body "$pr_body")"
          gh pr merge "$pr_url" --merge --delete-branch
          printf 'changed=true\n' >> "$GITHUB_OUTPUT"

      - name: Refresh development Pages
        if: steps.advance.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
